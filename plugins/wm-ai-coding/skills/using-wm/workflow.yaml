schema_version: 1
protocol_version: 2
name: using-wm
initial: clarify
gates:
  - design_approved
  - planning_artifacts
  - structural_analysis
  - frontend_design
  - task_contract
  - task_baseline
  - all_tasks_complete
  - verification
  - specs_synced
states:
  clarify:
    skill: brainstorming
    next: specify
    exit_gates: []
  specify:
    skill: openspec-propose
    conditional_skills:
      - when: frontend_surface_changed
        skill: frontend-design
    next: tasks
    exit_gates: [planning_artifacts, structural_analysis, frontend_design, design_approved]
  tasks:
    skill: openspec-continue-change
    next: apply
    exit_gates: [task_contract, task_baseline]
  apply:
    skill: openspec-apply-change
    next: verify
    repeat: per_task
    exit_gates: [all_tasks_complete]
  verify:
    skill: openspec-verify-change
    next: close
    exit_gates: [verification]
  close:
    skill: openspec-sync-specs
    next: archive
    exit_gates: [specs_synced]
  archive:
    skill: openspec-archive-change
    terminal: true
    exit_gates: []
