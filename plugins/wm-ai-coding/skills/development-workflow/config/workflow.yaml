schema_version: 1
protocol_version: 2
name: development-workflow
initial: clarify
gates:
- design_approved
- planning_artifacts
- structural_analysis
- frontend_design
- task_contract
- task_baseline
- all_tasks_complete
- verification
- specs_synced
states:
  clarify:
    skill: requirements-analysis
    next: specify
    exit_gates: []
  specify:
    skill: requirements-specification
    conditional_skills:
    - when: frontend_surface_changed
      skill: frontend-design
    next: tasks
    exit_gates:
    - planning_artifacts
    - structural_analysis
    - frontend_design
    - design_approved
    required_skills:
    - technical-design
    - test-design
  tasks:
    skill: development-planning
    next: apply
    exit_gates:
    - task_contract
    - task_baseline
  apply:
    skill: feature-development
    next: verify
    repeat: per_task
    exit_gates:
    - all_tasks_complete
  verify:
    skill: change-verification
    next: close
    exit_gates:
    - verification
    required_skills:
    - test-execution
    - code-review
  close:
    skill: specification-sync
    next: archive
    exit_gates:
    - specs_synced
  archive:
    skill: change-archive
    terminal: true
    exit_gates: []
